name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Package (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sublime Text's plugin host runs Python 3.8. ubuntu-latest (26.04) has
          # no Python 3.8 build, so this job stays on 24.04.
          - os: ubuntu-24.04
            python: '3.8'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check.py
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python -m pip install ruff==0.16.9
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python -m ruff check .
  editor:
    name: Sublime Text 4215 (real Linux editor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install display libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libasound2t64 libcurl4t64
      - name: Download and verify official editor
        shell: bash
        run: |
          mkdir -p build/editor-download
          cd build/editor-download
          curl --fail --location --retry 2 -O https://download.sublimetext.com/sublime_text_build_4215_x64.tar.xz
          printf '%s  %s\n' c153f418d3ab26b90ecce8c02a82e4e961025ed7a65f7e25060a5457d43e88d9 sublime_text_build_4215_x64.tar.xz | sha256sum --check --strict
          curl --fail --location --retry 2 -O https://download.sublimetext.com/sublime_text_build_4215_x64.tar.xz.asc
          curl --fail --location --retry 2 -O https://download.sublimetext.com/sublimehq-pub.gpg
          gpg --import sublimehq-pub.gpg
          gpg --verify sublime_text_build_4215_x64.tar.xz.asc sublime_text_build_4215_x64.tar.xz
          tar -xJf sublime_text_build_4215_x64.tar.xz
      - name: Test installed package in Sublime Text
        run: python scripts/run_editor_smoke.py --sublime-dir build/editor-download/sublime_text --output build/editor-evidence
      # Evidence is uploaded only when the editor test fails, and kept briefly:
      # artifact storage counts against the account's small monthly quota.
      # The installable package is committed in dist/ and published on the website.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: real-editor-evidence
          path: build/editor-evidence/
          if-no-files-found: ignore
          retention-days: 7
